# 环境变量配置
# 此文件用于管理敏感或可配置的环境变量

proxy:
  # 代理服务器配置
  # 格式: "IP:Port" 或 "域名:Port"
  # 留空表示不使用代理
  http: ""
  https: ""
  enabled: false

# 其他自定义环境变量
# 注意: .chezmoidata 文件不支持模板语法，只能存储纯数据
# 如需使用 home 目录，请只填写相对于 home 的路径部分
custom:
  # OpenCode 相关配置
  opencode:
    disable_default_plugins: 1
    path: ".opencode/bin"  # 相对于 $HOME 的路径

  # 临时目录配置
  tmpdir:
    path: ".claude/tmp"  # 相对于 $HOME 的路径

  # Neovim 额外路径（如需要）
  nvim:
    extra_path: ""
