# 环境变量配置
# 此文件用于管理敏感或可配置的环境变量

proxy:
  # 代理服务器配置
  # 格式: "IP:Port" 或 "域名:Port"
  # 留空表示不使用代理
  http: ""
  https: ""
  enabled: false

# 其他自定义环境变量
custom:
  # OpenCode 相关配置
  opencode:
    disable_default_plugins: 1
    path: "{{ .chezmoi.homeDir }}/.opencode/bin"

  # 临时目录配置
  tmpdir:
    path: "{{ .chezmoi.homeDir }}/.claude/tmp"

  # Neovim 额外路径（如需要）
  nvim:
    extra_path: ""
